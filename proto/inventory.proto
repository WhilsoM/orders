syntax = "proto3";

package inventory;

option go_package = "backend/pkg/gen/inventory;inventorypb";

service InventoryService {
  rpc GetItems(GetItemsRequest) returns (GetItemsResponse);
  rpc DecreaseItems(DecreaseItemsRequest) returns (DecreaseItemsResponse);
}

message GetItemsRequest {
  repeated int64 product_ids = 1;
}

message Item {
  int64 product_id = 1;
  int32 quantity = 2;
  int64 unit_price = 3;
}

message GetItemsResponse {
  repeated Item items = 1;
}


message DecreaseItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message DecreaseItemsRequest {
  repeated DecreaseItem items = 1;
}

message DecreaseItemsResponse {}
