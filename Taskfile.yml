version: "3"

vars:
  SERVICE: '{{default "orders" .SERVICE}}'
  MIGRATIONS: ./services/{{.SERVICE}}/migrations
  DB_URL: "postgres://postgres:mysecretpassword@localhost:5432/orders?sslmode=disable"
  PROTO_FILE: ./proto/{{.SERVICE}}.proto

tasks:
  run:order:
    cmds:
      - go run ./services/orders/cmd/api/
  run:inventory:
    cmds:
      - go run ./services/inventory/cmd/api/

  gen:
    desc: Generate protobuf and gRPC code
    cmds:
      - >
        protoc
        --proto_path=./proto
        --go_out=.
        --go_opt=module=backend
        --go-grpc_out=.
        --go-grpc_opt=module=backend
        {{.PROTO_FILE}}

  test:
    cmds:
      - go test ./...

  fmt:
    cmds:
      - go fmt ./...

  tidy:
    cmds:
      - go mod tidy

  migrate:create:
    cmds:
      - goose -dir {{.MIGRATIONS}} create {{.CLI_ARGS}} sql

  migrate:up:
    cmds:
      - goose -dir {{.MIGRATIONS}} postgres "{{.DB_URL}}" up

  migrate:down:
    cmds:
      - goose -dir {{.MIGRATIONS}} postgres "{{.DB_URL}}" down

  migrate:status:
    cmds:
      - goose -dir {{.MIGRATIONS}} postgres "{{.DB_URL}}" status
